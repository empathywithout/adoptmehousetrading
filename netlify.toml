[build]
  command = "npm run build"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"

# Netlify Functions: profiles, listings, offers, photo uploads (see netlify/functions/)
[functions]
  directory = "netlify/functions"

# Once a day: remind traders who had an offer accepted but haven't
# confirmed the trade yet (see netlify/functions/trade-confirm-reminders.js).
[functions."trade-confirm-reminders"]
  schedule = "@daily"

# Once a day: warn an owner (and anyone who saved the listing) a few days
# before it drops out of Browse, while renewing still prevents a gap.
# See netlify/functions/listings-expiry-reminders.js.
[functions."listings-expiry-reminders"]
  schedule = "@daily"

# Once a day: trigger a build so the generated house pages pick up the
# current listings and verified trades. Needs BUILD_HOOK_URL set; without it
# the function logs and does nothing. See netlify/functions/rebuild-site.js.
[functions."rebuild-site"]
  schedule = "@daily"

# Netlify Image CDN may only fetch remote images from hosts listed here.
# This is the public R2 bucket that listing and build photos are uploaded to;
# see cardPhoto() in public/js/api.js.
[images]
  remote_images = ["https://pub-cba78cf9524643c2a7bff415bfed4d9d\\.r2\\.dev/.*"]

# Cache static assets — images and data rarely change
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Short cache on shared modules. These are imported by the HTML pages, which
# are NOT cached for a day, so a long TTL here lets a new page load an old
# module. That is exactly what happened on the reputation deploy: pages
# importing loadReputation got a cached api.js without it and every page that
# imports api.js threw "does not provide an export named". Revalidating
# quickly means a mismatch lasts a minute, not a day.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

[[redirects]]
  from = "/house/*"
  to = "/houses/:splat.html"
  status = 301

[[redirects]]
  from = "/admin/dashboard"
  to = "/admin/dashboard.html"
  status = 200

[[redirects]]
  from = "/admin/disputes"
  to = "/admin/dashboard.html"
  status = 301

[[redirects]]
  from = "/comps"
  to = "/recent-trades.html"
  status = 301

[[redirects]]
  from = "/comps.html"
  to = "/recent-trades.html"
  status = 301
